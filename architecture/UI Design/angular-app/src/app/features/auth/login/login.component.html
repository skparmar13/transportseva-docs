<app-auth-shell
  backLink="/"
  [eyebrow]="'auth.login.eyebrow' | t"
  [title]="'login.title' | t"
  [sub]="'login.sub' | t"
>
  <form (ngSubmit)="submit()">
    <div class="field">
      <label>{{ 'login.identifierLabel' | t }}</label>
      <div class="input-wrap">
        <app-icon name="i-user" [size]="18" />
        <input
          type="text"
          class="input"
          [placeholder]="'login.identifierPlaceholder' | t"
          name="identifier"
          [ngModel]="identifier()"
          (ngModelChange)="identifier.set($event)"
          required
        >
      </div>
    </div>

    <div class="field">
      <label>{{ 'auth.password' | t }}</label>
      <div class="input-wrap input-suffix-wrap">
        <app-icon name="i-lock" [size]="18" />
        <input
          [type]="showPassword() ? 'text' : 'password'"
          class="input"
          [placeholder]="'login.passwordPlaceholder' | t"
          name="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          required
        >
        <button type="button" class="input-suffix-btn" (click)="togglePassword()">
          {{ (showPassword() ? 'login.hide' : 'login.show') | t }}
        </button>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin:18px 0 24px;">
      <label class="checkbox-row" style="margin:0;">
        <input type="checkbox" [ngModel]="rememberMe()" (ngModelChange)="rememberMe.set($event)" name="rememberMe">
        <span>{{ 'auth.rememberMe' | t }}</span>
      </label>
      <a routerLink="/auth/forgot-password" style="color:var(--color-primary); font-weight:700; font-size:13.5px;">{{ 'auth.forgotPasswordLink' | t }}</a>
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      <span>{{ (submitting() ? 'login.submitting' : 'login.submit') | t }}</span>
      @if (!submitting()) {
        <app-icon name="i-arrow-right" [size]="18" />
      }
    </button>
  </form>

  <div class="link-row">
    <span>{{ 'login.newToApp' | t }}</span>
    <a routerLink="/auth/signup">{{ 'login.createAccount' | t }}</a>
  </div>
  <div class="link-row">
    <span>{{ 'staffLogin.employeePrompt' | t }}</span>
    <a routerLink="/auth/staff/login">{{ 'staffLogin.link' | t }}</a>
  </div>
</app-auth-shell>
