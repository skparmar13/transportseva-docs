<h1>{{ 'postLoad.title' | t }}</h1>
<p class="desc">{{ 'postLoad.desc' | t }}</p>

@if (submitted()) {
  <div class="card">
    <div class="card-body" style="text-align:center;padding:48px 22px;">
      <div class="kpi-icon" style="width:56px;height:56px;margin:0 auto 18px;">
        <app-icon name="i-check" [size]="28" />
      </div>
      <h3 style="font-size:19px;margin-bottom:8px;">{{ 'postLoad.success.title' | t:{ id: postedLoadId() } }}</h3>
      <p style="color:var(--color-text-muted);margin-bottom:24px;">{{ 'postLoad.success.desc' | t }}</p>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button type="button" class="btn btn-outline" (click)="postAnother()">{{ 'postLoad.success.postAnother' | t }}</button>
        <button type="button" class="btn btn-primary" (click)="goToMyLoads()">{{ 'postLoad.success.viewMyLoads' | t }}</button>
      </div>
    </div>
  </div>
} @else {
  <div class="card" style="max-width:720px;">
    <div class="card-body">
      <form (ngSubmit)="submit()">
        @if (isTransporter()) {
          <div class="field">
            <label>{{ 'postLoad.onBehalfLabel' | t }}</label>
            <div class="input-wrap">
              <app-icon name="i-user" [size]="18" />
              <input type="text" class="input" [placeholder]="'postLoad.onBehalfPlaceholder' | t" [ngModel]="onBehalfOfCustomer()" (ngModelChange)="onBehalfOfCustomer.set($event)" name="onBehalfOfCustomer" />
            </div>
            <div class="hint">{{ 'postLoad.onBehalfHint' | t }}</div>
          </div>
        }

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="field">
            <label>{{ 'postLoad.pickupCity' | t }}</label>
            <div class="input-wrap">
              <app-icon name="i-pin" [size]="18" />
              <input type="text" class="input" [placeholder]="'postLoad.pickupCityPlaceholder' | t" required [ngModel]="pickupCity()" (ngModelChange)="pickupCity.set($event)" name="pickupCity" />
            </div>
          </div>
          <div class="field">
            <label>{{ 'postLoad.dropCity' | t }}</label>
            <div class="input-wrap">
              <app-icon name="i-pin" [size]="18" />
              <input type="text" class="input" [placeholder]="'postLoad.dropCityPlaceholder' | t" required [ngModel]="dropCity()" (ngModelChange)="dropCity.set($event)" name="dropCity" />
            </div>
          </div>
        </div>

        <div class="field">
          <label>{{ 'postLoad.material' | t }}</label>
          <div class="input-wrap">
            <app-icon name="i-box" [size]="18" />
            <input type="text" class="input" [placeholder]="'postLoad.materialPlaceholder' | t" required [ngModel]="material()" (ngModelChange)="material.set($event)" name="material" />
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="field">
            <label>{{ 'postLoad.weight' | t }}</label>
            <div class="input-wrap">
              <app-icon name="i-box" [size]="18" />
              <input type="number" class="input" [placeholder]="'postLoad.weightPlaceholder' | t" [ngModel]="weightTons()" (ngModelChange)="weightTons.set($event)" name="weightTons" />
            </div>
          </div>
          <div class="field">
            <label>{{ 'postLoad.vehicleType' | t }}</label>
            <select class="input" style="padding-left:14px;" [ngModel]="vehicleType()" (ngModelChange)="vehicleType.set($event)" name="vehicleType">
              @for (type of vehicleTypes; track type) {
                <option [value]="type">{{ type }}</option>
              }
            </select>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="field">
            <label>{{ 'postLoad.pickupDate' | t }}</label>
            <div class="input-wrap">
              <app-icon name="i-calendar" [size]="18" />
              <input type="date" class="input" [ngModel]="pickupDate()" (ngModelChange)="pickupDate.set($event)" name="pickupDate" />
            </div>
          </div>
          <div class="field">
            <label>{{ 'postLoad.budget' | t }}</label>
            <div class="input-wrap">
              <app-icon name="i-wallet" [size]="18" />
              <input type="text" class="input" [placeholder]="'postLoad.budgetPlaceholder' | t" required [ngModel]="budget()" (ngModelChange)="budget.set($event)" name="budget" />
            </div>
          </div>
        </div>

        <div class="field">
          <label>{{ 'postLoad.notes' | t }}</label>
          <textarea class="input" style="padding:12px 14px;min-height:80px;resize:vertical;" [placeholder]="'postLoad.notesPlaceholder' | t" [ngModel]="notes()" (ngModelChange)="notes.set($event)" name="notes"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
          <span>{{ submitting() ? ('postLoad.submitting' | t) : ('postLoad.submit' | t) }}</span>
          @if (!submitting()) {
            <app-icon name="i-arrow-right" [size]="18" />
          }
        </button>
      </form>
    </div>
  </div>
}
