<app-auth-shell
  backLink="/auth/signup"
  [backLabel]="'otp.back' | t"
  [eyebrow]="'otp.eyebrow' | t"
  [title]="'otp.title' | t"
  [sub]="'otp.sub' | t:{ target: identifier() || ('otp.fallbackTarget' | t) }"
>
  <form (ngSubmit)="verify()">
    <div class="field">
      <label>{{ 'otp.otpLabel' | t }}</label>
      <div class="otp-row">
        @for (digit of digits(); track $index) {
          <input
            #otpInput
            class="otp-box"
            [class.otp-invalid]="apiError()"
            maxlength="1"
            inputmode="numeric"
            type="text"
            pattern="[0-9]"
            autocomplete="one-time-code"
            [ngModel]="digit"
            (ngModelChange)="onDigitInput($index, $event)"
            [name]="'otp' + $index"
          >
        }
      </div>
      <p class="hint">{{ 'otp.notReceived' | t }} <button type="button" class="link-button" [disabled]="resending()" (click)="resend()">{{ (resending() ? 'Sending…' : 'otp.resendOtp') | t }}</button></p>
      @if (debugOtp()) {
        <p class="otp-debug">Development OTP: <strong>{{ debugOtp() }}</strong></p>
      }
      @if (resendMessage()) {
        <p class="otp-resend-message">{{ resendMessage() }}</p>
      }
      @if (apiError()) {
        <p class="otp-error" role="alert">{{ apiError() }}</p>
      }
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="verifying() || !isOtpComplete()">
      {{ (verifying() ? 'otp.verifying' : 'otp.verify') | t }}
    </button>
  </form>

  <div class="link-row otp-back-link">
    <a routerLink="/auth/login">{{ 'otp.backToLogin' | t }}</a>
  </div>
</app-auth-shell>
