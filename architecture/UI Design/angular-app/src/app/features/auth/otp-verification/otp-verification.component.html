<app-auth-shell
  backLink="/auth/signup"
  [backLabel]="'otp.back' | t"
  [eyebrow]="'otp.eyebrow' | t"
  [title]="'otp.title' | t"
  [sub]="'otp.sub' | t:{ target: identifier() || ('otp.fallbackTarget' | t) }"
>
  <form (ngSubmit)="verify()">
    <div class="field">
      <label>{{ 'otp.otpLabel' | t }}</label>
      <div class="otp-row">
        @for (digit of digits(); track $index) {
          <input
            #otpInput
            class="otp-box"
            maxlength="1"
            inputmode="numeric"
            [ngModel]="digit"
            (ngModelChange)="onDigitInput($index, $event)"
            [name]="'otp' + $index"
          >
        }
      </div>
      <p class="hint">{{ 'otp.notReceived' | t }} <button type="button" class="link-button" (click)="resend()">{{ 'otp.resendOtp' | t }}</button></p>
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="verifying()">
      {{ (verifying() ? 'otp.verifying' : 'otp.verify') | t }}
    </button>
  </form>

  <div class="link-row">
    <a routerLink="/auth/login">{{ 'otp.backToLogin' | t }}</a>
  </div>
</app-auth-shell>
