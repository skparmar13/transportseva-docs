<div class="page-toolbar"><div><h1>Audit Logs</h1><p class="desc">Trace administrative, financial, and security-sensitive actions.</p></div></div>
<div class="page-toolbar"><div class="tab-row"><button type="button" class="tab-btn" [class.active]="filter() === 'All'" (click)="filter.set('All')">All activity</button><button type="button" class="tab-btn" [class.active]="filter() === 'Info'" (click)="filter.set('Info')">Info</button><button type="button" class="tab-btn" [class.active]="filter() === 'Review'" (click)="filter.set('Review')">Review</button><button type="button" class="tab-btn" [class.active]="filter() === 'Security'" (click)="filter.set('Security')">Security</button></div></div>
<div class="card"><div class="table-scroll"><table class="data-table"><caption class="sr-only">Administrative audit events</caption><thead><tr><th scope="col">Time</th><th scope="col">Actor</th><th scope="col">Action</th><th scope="col">Target</th><th scope="col">Category</th></tr></thead><tbody>@for (event of filtered(); track event.time + event.target) {<tr><td>{{ event.time }}</td><td><b>{{ event.actor }}</b></td><td>{{ event.action }}</td><td>{{ event.target }}</td><td><span class="status-pill" [class.status-delivered]="event.severity === 'Info'" [class.status-pending]="event.severity === 'Review'" [class.status-cancelled]="event.severity === 'Security'">{{ event.severity }}</span></td></tr>}</tbody></table></div></div>
