<app-auth-shell
  backLink="/auth/login"
  backLabel="Back to Log In"
  eyebrow="Account Recovery"
  title="Forgot your Password?"
  sub="Enter your registered email or mobile number and we'll send you a one-time code to reset it."
  visualHeadingLine1="Secure access,"
  visualHeadingLine2="every time."
  visualDescription="Your account security matters to us. Reset your password safely with OTP verification in just a few steps."
>
  <div class="steps-row">
    <div class="step-dot" [class.active]="step() === 1" [class.done]="step() > 1">1</div>
    <div class="step-line" [class.done]="step() > 1"></div>
    <div class="step-dot" [class.active]="step() === 2" [class.done]="step() > 2">2</div>
    <div class="step-line" [class.done]="step() > 2"></div>
    <div class="step-dot" [class.active]="step() === 3">3</div>
  </div>

  @if (step() === 1) {
    <form (ngSubmit)="sendOtp()">
      <div class="field">
        <label>Email or Mobile Number</label>
        <div class="input-wrap">
          <app-icon name="i-user" [size]="18" />
          <input type="text" class="input" placeholder="Enter email or mobile number" name="identifier" [ngModel]="identifier()" (ngModelChange)="identifier.set($event)" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="busy()">
        {{ busy() ? 'Sending…' : 'Send OTP' }}
      </button>
    </form>
  }

  @if (step() === 2) {
    <form (ngSubmit)="verifyOtp()">
      <h3 style="font-size:16px; margin-bottom:16px;">Verify OTP</h3>
      <div class="field">
        <label>Enter 6-digit OTP</label>
        <div class="otp-row">
          @for (digit of digits(); track $index) {
            <input
              #otpInput
              class="otp-box"
              maxlength="1"
              inputmode="numeric"
              [ngModel]="digit"
              (ngModelChange)="onDigitInput($index, $event)"
              [name]="'otp' + $index"
            >
          }
        </div>
        <p class="hint">OTP sent to {{ identifier() }} &middot; <a href="javascript:void(0)" (click)="resend()" style="color:var(--color-primary); font-weight:700;">Resend OTP</a></p>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="busy()">
        {{ busy() ? 'Verifying…' : 'Verify OTP' }}
      </button>
    </form>
  }

  @if (step() === 3) {
    <form (ngSubmit)="resetPassword()">
      <h3 style="font-size:16px; margin-bottom:16px;">Set New Password</h3>
      <div class="field">
        <label>New Password</label>
        <div class="input-wrap">
          <app-icon name="i-lock" [size]="18" />
          <input type="password" class="input" placeholder="Enter new password" name="newPassword" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" required>
        </div>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <app-icon name="i-lock" [size]="18" />
          <input type="password" class="input" placeholder="Re-enter new password" name="confirmPassword" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="busy()">
        {{ busy() ? 'Saving…' : 'Reset Password' }}
      </button>
    </form>
  }

  <div class="link-row">
    <a routerLink="/auth/login">Back to Log In</a>
  </div>
</app-auth-shell>
