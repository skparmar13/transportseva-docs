<app-auth-shell
  backLink="/auth/login"
  [backLabel]="'profileSetup.back' | t"
  [eyebrow]="'profileSetup.eyebrow' | t"
  [title]="'profileSetup.title' | t"
  [sub]="'profileSetup.sub' | t"
  [visualHeadingLine1]="'profileSetup.visual.title1' | t"
  [visualHeadingLine2]="'profileSetup.visual.title2' | t"
  [visualDescription]="'profileSetup.visual.description' | t"
>
  <form (ngSubmit)="submit()">
    <div class="field">
      <label>{{ 'profileSetup.designationLabel' | t }}</label>
      <div class="input-wrap">
        <app-icon name="i-user" [size]="18" />
        <input type="text" class="input" [placeholder]="'profileSetup.designationPlaceholder' | t" name="designation" [ngModel]="designation()" (ngModelChange)="designation.set($event)">
      </div>
    </div>

    <div class="field">
      <label>{{ 'profileSetup.addressLabel' | t }}</label>
      <div class="input-wrap">
        <app-icon name="i-map" [size]="18" />
        <app-location-picker id="profile-address" name="address" labelKey="profileSetup.addressLabel" placeholderKey="profileSetup.addressPlaceholder" [value]="address()" (valueChange)="address.set($event)" />
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div class="field">
        <label>{{ 'profileSetup.cityLabel' | t }}</label>
        <app-location-picker id="profile-city" name="city" labelKey="profileSetup.cityLabel" placeholderKey="profileSetup.cityLabel" [value]="city()" (valueChange)="city.set($event)" (locationSelected)="setProfileCity($event)" />
      </div>
      <div class="field">
        <label>{{ 'profileSetup.pincodeLabel' | t }}</label>
        <input type="text" class="input" inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6" [placeholder]="'profileSetup.pincodeLabel' | t" name="pincode" [ngModel]="pincode()" (ngModelChange)="pincode.set($event)">
      </div>
    </div>

    <label class="checkbox-row" style="margin-bottom:10px;">
      <input type="checkbox" [ngModel]="notifyEmail()" (ngModelChange)="notifyEmail.set($event)" name="notifyEmail">
      <span>{{ 'profileSetup.emailUpdates' | t }}</span>
    </label>
    <label class="checkbox-row" style="margin-bottom:22px;">
      <input type="checkbox" [ngModel]="notifySms()" (ngModelChange)="notifySms.set($event)" name="notifySms">
      <span>{{ 'profileSetup.smsUpdates' | t }}</span>
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      <span>{{ (submitting() ? 'profileSetup.saving' : 'profileSetup.finishSetup') | t }}</span>
      @if (!submitting()) {
        <app-icon name="i-arrow-right" [size]="18" />
      }
    </button>
  </form>

  <div class="link-row">
    <button type="button" class="link-button" (click)="skip()">{{ 'profileSetup.skipForNow' | t }}</button>
  </div>
</app-auth-shell>
