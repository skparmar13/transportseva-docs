<label [for]="id">{{ labelKey | t }}</label>
<div style="position:relative;">
  <input
    type="text"
    class="input"
    [id]="id"
    [name]="name"
    [placeholder]="placeholderKey | t"
    [value]="query()"
    autocomplete="off"
    role="combobox"
    aria-autocomplete="list"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="id + '-suggestions'"
    (input)="onInput($event)"
    (blur)="closeSuggestions()"
  />
  @if (isOpen()) {
    <div [id]="id + '-suggestions'" role="listbox" [style.top]="suggestionsAbove ? 'auto' : 'calc(100% + 4px)'" [style.bottom]="suggestionsAbove ? 'calc(100% + 4px)' : 'auto'" style="position:absolute;z-index:1200;left:0;right:0;max-height:260px;overflow:auto;background:var(--color-surface,#fff);border:1px solid var(--color-border);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.14);">
      @if (loading()) {
        <div role="status" style="padding:11px 13px;font-size:13px;color:var(--color-text-muted);">{{ 'locationPicker.loading' | t }}</div>
      } @else if (suggestions().length) {
        @for (location of suggestions(); track location.osmId ?? location.label) {
          <button type="button" role="option" class="location-option" style="display:block;width:100%;padding:10px 13px;text-align:left;border:0;border-bottom:1px solid var(--color-border);background:transparent;color:var(--color-text);cursor:pointer;" (mousedown)="$event.preventDefault()" (click)="select(location)">
            <span style="display:block;font-size:13px;font-weight:600;">{{ location.label }}</span>
            <span style="display:block;margin-top:3px;font-size:11px;color:var(--color-text-muted);">{{ 'locationPicker.openStreetMap' | t }} · {{ location.latitude.toFixed(5) }}, {{ location.longitude.toFixed(5) }}</span>
          </button>
        }
      } @else if (failed()) {
        <div role="status" style="padding:11px 13px;font-size:13px;color:var(--color-text-muted);">{{ 'locationPicker.unavailable' | t }}</div>
      } @else {
        <div role="status" style="padding:11px 13px;font-size:13px;color:var(--color-text-muted);">{{ 'locationPicker.noResults' | t }}</div>
      }
    </div>
  }
</div>
