<app-auth-shell
  backLink="/auth/otp-verification"
  [backLabel]="'businessReg.back' | t"
  [eyebrow]="'businessReg.eyebrow' | t"
  [title]="'businessReg.title' | t"
  [sub]="'businessReg.sub' | t"
  [visualHeadingLine1]="'businessReg.visual.title1' | t"
  [visualHeadingLine2]="'businessReg.visual.title2' | t"
  [visualDescription]="'businessReg.visual.description' | t"
  visualImage="images/app-truck.png"
  [wide]="true"
>
  <form #businessForm="ngForm" (ngSubmit)="submit(businessForm)">
    <div class="field">
      <label>{{ 'businessReg.businessType' | t }}</label>
      <div class="input-wrap" aria-live="polite"><span>{{ ('businessReg.type.' + (businessType() === 'truck-owner' ? 'truckOwner' : businessType())) | t }}</span></div>
    </div>

    <div class="field">
      <label>{{ 'businessReg.companyLabel' | t }}</label>
      <div class="input-wrap">
        <app-icon name="i-building" [size]="18" />
        <input type="text" class="input" [placeholder]="'businessReg.companyPlaceholder' | t" name="companyName" [ngModel]="companyName()" (ngModelChange)="companyName.set($event)" required>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div class="field">
        <label>{{ 'businessReg.gstLabel' | t }}</label>
        <div class="input-wrap">
          <app-icon name="i-doc" [size]="18" />
          <input type="text" class="input" placeholder="22AAAAA0000A1Z5" name="gstNumber" [ngModel]="gstNumber()" (ngModelChange)="gstNumber.set($event)">
        </div>
      </div>
      <div class="field">
        <label>{{ 'businessReg.panLabel' | t }}</label>
        <div class="input-wrap">
          <app-icon name="i-doc" [size]="18" />
          <input type="text" class="input" placeholder="AAAAA0000A" name="panNumber" [ngModel]="panNumber()" (ngModelChange)="panNumber.set($event)">
        </div>
      </div>
    </div>

    <div class="field">
      <label>{{ 'businessReg.fleetSizeLabel' | t }}</label>
      <div class="input-wrap">
        <app-icon name="i-truck" [size]="18" />
<input type="number" class="input" min="1" max="100000" step="1" [required]="businessType() === 'truck-owner'" [placeholder]="'businessReg.fleetSizePlaceholder' | t" name="fleetSize" [ngModel]="fleetSize()" (ngModelChange)="fleetSize.set($event)">
      </div>
    </div>

    <div class="field">
      <div class="input-wrap">
        <app-location-picker id="business-address" name="address" labelKey="businessReg.addressLabel" placeholderKey="businessReg.addressPlaceholder" [value]="address()" (valueChange)="address.set($event)" (locationSelected)="setBusinessLocation($event)" />
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
      <div class="field">
        <app-location-picker id="business-city" name="city" labelKey="businessReg.cityLabel" placeholderKey="businessReg.cityLabel" [value]="city()" (valueChange)="city.set($event)" (locationSelected)="setBusinessLocation($event)" />
      </div>
      <div class="field">
        <label>{{ 'businessReg.stateLabel' | t }}</label>
        <input type="text" class="input" [placeholder]="'businessReg.stateLabel' | t" name="state" [ngModel]="state()" (ngModelChange)="state.set($event)" required>
      </div>
      <div class="field">
        <label>{{ 'businessReg.pincodeLabel' | t }}</label>
<input type="text" class="input" inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6" [placeholder]="'businessReg.pincodeLabel' | t" name="pincode" [ngModel]="pincode()" (ngModelChange)="pincode.set($event)" required>
      </div>
    </div>

    @if (validationError()) {
      <p class="hint" role="alert">{{ validationError() | t }}</p>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      <span>{{ (submitting() ? 'businessReg.saving' : 'common.continue') | t }}</span>
      @if (!submitting()) {
        <app-icon name="i-arrow-right" [size]="18" />
      }
    </button>
  </form>
</app-auth-shell>
