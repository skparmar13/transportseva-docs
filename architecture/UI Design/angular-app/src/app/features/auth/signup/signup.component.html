<app-auth-shell
  backLink="/"
  eyebrow="Get Started"
  title="Create your account"
  sub="Choose your role to get a workspace built for you."
  visualHeadingLine1="One platform for"
  visualHeadingLine2="every logistics need."
  visualDescription="Whether you ship, drive or manage a fleet — TransportSeva gives you the tools to work faster and smarter."
  visualImage="images/app-truck.png"
>
  <div class="plan-indicator">
    <app-icon name="i-tag" [size]="16" />
    <span>
      Signing up for the <b>{{ planTier() === 'professional' ? 'Professional' : 'Starter (Free)' }}</b> plan.
    </span>
    <a routerLink="/pricing">Change plan</a>
  </div>

  <div class="role-grid">
    @for (option of roleOptions; track option.role) {
      <div
        class="role-card"
        [class.active]="selectedRole() === option.role"
        (click)="selectRole(option.role)"
      >
        <div class="role-info-wrap">
          <button type="button" class="role-info-btn" [attr.aria-label]="'What is a ' + option.label + '?'" (click)="$event.stopPropagation()">
            <app-icon name="i-info" [size]="12" />
          </button>
          <div class="role-tooltip" role="tooltip">
            {{ option.description }}
            <span class="role-tooltip-examples">{{ option.examples }}</span>
          </div>
        </div>
        <div class="role-icon"><app-icon [name]="option.icon" [size]="22" /></div>
        <span class="role-label">{{ option.label }}</span>
      </div>
    }
  </div>

  <form (ngSubmit)="submit()">
    <div class="field">
      <label>Full Name</label>
      <div class="input-wrap">
        <app-icon name="i-user" [size]="18" />
        <input type="text" class="input" placeholder="Enter your full name" name="fullName" [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" required>
      </div>
    </div>

    <div class="field">
      <label>Mobile Number</label>
      <div class="phone-input-wrap">
        <div class="phone-code">+91</div>
        <div class="input-wrap" style="flex:1;">
          <app-icon name="i-phone" [size]="18" />
          <input type="tel" class="input" maxlength="10" placeholder="Enter 10-digit mobile number" name="mobile" [ngModel]="mobile()" (ngModelChange)="mobile.set($event)" required>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Email Address (optional)</label>
      <div class="input-wrap">
        <app-icon name="i-mail" [size]="18" />
        <input type="email" class="input" placeholder="Enter your email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)">
      </div>
    </div>

    @if (requiresCompany()) {
      <div class="field">
        <label>Company / Fleet Name</label>
        <div class="input-wrap">
          <app-icon name="i-building" [size]="18" />
          <input type="text" class="input" placeholder="Enter company or fleet name" name="companyName" [ngModel]="companyName()" (ngModelChange)="companyName.set($event)">
        </div>
      </div>
    }

    <div class="field">
      <label>Create Password</label>
      <div class="input-wrap">
        <app-icon name="i-lock" [size]="18" />
        <input type="password" class="input" placeholder="Create a password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required>
      </div>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <app-icon name="i-lock" [size]="18" />
        <input type="password" class="input" placeholder="Re-enter password" name="confirmPassword" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" required>
      </div>
    </div>

    <label class="checkbox-row" style="margin-bottom:22px;">
      <input type="checkbox" [ngModel]="agreeTerms()" (ngModelChange)="agreeTerms.set($event)" name="agreeTerms">
      <span>I agree to the <a routerLink="/terms-conditions">Terms &amp; Conditions</a> and <a routerLink="/privacy-policy">Privacy Policy</a></span>
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      <span>{{ submitting() ? 'Creating account…' : 'Create Account' }}</span>
      @if (!submitting()) {
        <app-icon name="i-arrow-right" [size]="18" />
      }
    </button>
  </form>

  <div class="link-row">
    <span>Already have an account?</span>
    <a routerLink="/auth/login">Log in</a>
  </div>
</app-auth-shell>
