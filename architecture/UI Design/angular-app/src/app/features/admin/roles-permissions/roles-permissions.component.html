<div class="page-toolbar"><div><h1>{{ 'admin.roles.title' | t }}</h1><p class="desc">{{ 'admin.roles.desc' | t }}</p></div><button type="button" class="btn btn-primary" (click)="save()">{{ 'admin.roles.save' | t }}</button></div>
@if (saved()) { <div class="alert alert-success" role="status" style="margin-bottom:16px;">{{ 'admin.roles.saved' | t }}</div> }
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;">@for (role of roles(); track role.name) {<div class="card"><div class="card-body"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><h3 style="margin:0;">{{ role.name }}</h3><p class="desc" style="margin:4px 0 16px;">{{ role.members }} members</p></div><span class="status-pill status-delivered">Active</span></div>@for (permission of allPermissions; track permission) {<label style="display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13px;border-top:1px solid var(--color-border);"><input type="checkbox" [checked]="role.permissions.includes(permission)" (change)="toggle(role, permission)" />{{ permission }}</label>}</div></div>}</div>
