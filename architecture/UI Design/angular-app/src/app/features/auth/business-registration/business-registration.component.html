<app-auth-shell
  backLink="/auth/otp-verification"
  [backLabel]="'businessReg.back' | t"
  [eyebrow]="'businessReg.eyebrow' | t"
  [title]="'businessReg.title' | t"
  [sub]="'businessReg.sub' | t"
  [visualHeadingLine1]="'businessReg.visual.title1' | t"
  [visualHeadingLine2]="'businessReg.visual.title2' | t"
  [visualDescription]="'businessReg.visual.description' | t"
  visualImage="images/app-truck.png"
  [wide]="true"
>
  <form (ngSubmit)="submit()">
    <div class="field">
      <label>{{ 'businessReg.businessType' | t }}</label>
      <div class="role-grid" style="grid-template-columns: repeat(3, 1fr);">
        @for (type of businessTypes; track type.value) {
          <div class="role-card" [class.active]="businessType() === type.value" (click)="businessType.set(type.value)" style="padding:12px 8px;">
            <span style="font-size:12px;">{{ type.labelKey | t }}</span>
          </div>
        }
      </div>
    </div>

    <div class="field">
      <label>{{ 'businessReg.companyLabel' | t }}</label>
      <div class="input-wrap">
        <app-icon name="i-building" [size]="18" />
        <input type="text" class="input" [placeholder]="'businessReg.companyPlaceholder' | t" name="companyName" [ngModel]="companyName()" (ngModelChange)="companyName.set($event)" required>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div class="field">
        <label>{{ 'businessReg.gstLabel' | t }}</label>
        <div class="input-wrap">
          <app-icon name="i-doc" [size]="18" />
          <input type="text" class="input" placeholder="22AAAAA0000A1Z5" name="gstNumber" [ngModel]="gstNumber()" (ngModelChange)="gstNumber.set($event)">
        </div>
      </div>
      <div class="field">
        <label>{{ 'businessReg.panLabel' | t }}</label>
        <div class="input-wrap">
          <app-icon name="i-doc" [size]="18" />
          <input type="text" class="input" placeholder="AAAAA0000A" name="panNumber" [ngModel]="panNumber()" (ngModelChange)="panNumber.set($event)">
        </div>
      </div>
    </div>

    <div class="field">
      <label>{{ 'businessReg.fleetSizeLabel' | t }}</label>
      <div class="input-wrap">
        <app-icon name="i-truck" [size]="18" />
        <input type="number" class="input" [placeholder]="'businessReg.fleetSizePlaceholder' | t" name="fleetSize" [ngModel]="fleetSize()" (ngModelChange)="fleetSize.set($event)">
      </div>
    </div>

    <div class="field">
      <label>{{ 'businessReg.addressLabel' | t }}</label>
      <div class="input-wrap">
        <app-icon name="i-map" [size]="18" />
        <input type="text" class="input" [placeholder]="'businessReg.addressPlaceholder' | t" name="address" [ngModel]="address()" (ngModelChange)="address.set($event)">
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
      <div class="field">
        <label>{{ 'businessReg.cityLabel' | t }}</label>
        <input type="text" class="input" [placeholder]="'businessReg.cityLabel' | t" name="city" [ngModel]="city()" (ngModelChange)="city.set($event)">
      </div>
      <div class="field">
        <label>{{ 'businessReg.stateLabel' | t }}</label>
        <input type="text" class="input" [placeholder]="'businessReg.stateLabel' | t" name="state" [ngModel]="state()" (ngModelChange)="state.set($event)">
      </div>
      <div class="field">
        <label>{{ 'businessReg.pincodeLabel' | t }}</label>
        <input type="text" class="input" [placeholder]="'businessReg.pincodeLabel' | t" name="pincode" [ngModel]="pincode()" (ngModelChange)="pincode.set($event)">
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      <span>{{ (submitting() ? 'businessReg.saving' : 'common.continue') | t }}</span>
      @if (!submitting()) {
        <app-icon name="i-arrow-right" [size]="18" />
      }
    </button>
  </form>
</app-auth-shell>
