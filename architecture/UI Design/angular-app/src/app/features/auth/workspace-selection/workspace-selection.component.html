<app-auth-shell
  backLink="/auth/login"
  [backLabel]="'workspaceSelection.backToLogin' | t"
  [eyebrow]="'workspaceSelection.eyebrow' | t"
  [title]="'workspaceSelection.title' | t"
  [sub]="'workspaceSelection.sub' | t"
  [visualHeadingLine1]="'workspaceSelection.visual.title1' | t"
  [visualHeadingLine2]="'workspaceSelection.visual.title2' | t"
  [visualDescription]="'workspaceSelection.visual.description' | t"
>
  <div class="workspace-grid">
    @for (workspace of workspaces(); track workspace.id) {
      <button type="button" class="workspace-card" (click)="selectWorkspace(workspace)">
        <div class="workspace-icon"><app-icon [name]="workspace.icon" [size]="22" /></div>
        <div>
          <div class="workspace-name">{{ workspace.name }}</div>
          <div class="workspace-role">{{ roleTagKey(workspace.role) | t }}</div>
        </div>
      </button>
    }
  </div>

  <div class="link-row">
    <button type="button" class="link-button" disabled>{{ 'workspaceSelection.addAnother' | t }}</button>
  </div>
</app-auth-shell>
